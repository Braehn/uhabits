name: Build APK

# Builds the app, runs the core unit tests, and keeps the newest APK from the
# dev branch on the "latest" release, where a phone can download it directly.

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Every APK must be signed with the same key, or Android refuses to install
      # it over the previous one. The key lives in the DEBUG_KEYSTORE_BASE64 secret.
      - name: Install the signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::The DEBUG_KEYSTORE_BASE64 secret is not set, so this APK has a one-off key and cannot update an installed copy."
          fi

      - name: Run core unit tests
        run: ./gradlew --console=plain :uhabits-core:jvmTest

      - name: Build APK
        run: ./gradlew --console=plain :uhabits-android:assembleDebug

      - name: Rename APK
        run: cp uhabits-android/build/outputs/apk/debug/*.apk habits-plus.apk

      - uses: actions/upload-artifact@v4
        with:
          name: habits-plus-apk
          path: habits-plus.apk

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest habits-plus.apk \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. On your phone, download habits-plus.apk and open it to install or update." \
            --target "$GITHUB_SHA"
