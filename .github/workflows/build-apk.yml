name: Build APK

# Builds the app, runs the core unit tests, and keeps the newest APK from the
# dev branch on the "latest" release, where a phone can download it directly.

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Every APK must be signed with the same key, or Android refuses to install
      # it over the previous one. The key lives in the DEBUG_KEYSTORE_BASE64 secret;
      # DEBUG_KEYSTORE tells the build (uhabits-android/build.gradle.kts) where it is.
      - name: Install the signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            keytool -list -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey | grep "SHA-256"
          else
            echo "::warning::The DEBUG_KEYSTORE_BASE64 secret is not set, so this APK has a one-off key and cannot update an installed copy."
          fi

      - name: Run core unit tests
        run: ./gradlew --console=plain :uhabits-core:jvmTest

      - name: Build APK
        run: ./gradlew --console=plain :uhabits-android:assembleDebug

      - name: Rename APK
        run: cp uhabits-android/build/outputs/apk/debug/*.apk habits-plus.apk

      - name: Check the APK is signed with the secret's key
        if: env.DEBUG_KEYSTORE != ''
        run: |
          want=$(keytool -list -keystore "$DEBUG_KEYSTORE" -storepass android -alias androiddebugkey \
            | grep -o 'SHA-256): .*' | cut -d' ' -f2 | tr -d ':' | tr 'A-F' 'a-f')
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          got=$("$apksigner" verify --print-certs habits-plus.apk | grep -o 'SHA-256 digest: .*' | cut -d' ' -f3)
          echo "Key in the secret: $want"
          echo "Key on the APK:    $got"
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "::error::The APK is not signed with the key in DEBUG_KEYSTORE_BASE64."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: habits-plus-apk
          path: habits-plus.apk

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest habits-plus.apk \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. On your phone, download habits-plus.apk and open it to install or update." \
            --target "$GITHUB_SHA"
